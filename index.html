<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Farm System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
/* =====================================================================
   SMART FARM SYSTEM — Design B (Control Room)
   ===================================================================== */
:root {
  --font: 'Inter', 'IBM Plex Sans Thai', system-ui, sans-serif;
  --ease: cubic-bezier(.22,.61,.36,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  --brand: #10b981; --brand-2: #14b8a6; --mint: #6ee7b7;
  --grad: linear-gradient(135deg, #10b981, #14b8a6);
  --r-lg: 22px;
}
html[data-theme="dark"] {
  --bg: #050907; --bg-2: #0d1714;
  --surface: rgba(15, 23, 20, .58); --surface-solid: #0d1512; --surface-2: rgba(255,255,255,.035); --surface-3: rgba(255,255,255,.07);
  --side-bg: rgba(7, 12, 10, .62); --drawer-bg: rgba(10, 16, 14, .94);
  --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.12);
  --edge-1: rgba(255,255,255,.16); --edge-2: rgba(255,255,255,.025); --edge-3: rgba(16,185,129,.30);
  --text: #ecfdf5; --text-2: #a3b8b0; --muted: #6b8079;
  --c-temp: #fb923c; --c-soil: #34d399; --c-light: #fbbf24;
  --grid-1: rgba(255,255,255,.035); --grid-2: rgba(255,255,255,.075);
  --glow-1: rgba(16,185,129,.22); --glow-2: rgba(20,184,166,.15); --glow-3: rgba(56,189,248,.07);
  --shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 24px 50px -24px rgba(0,0,0,.7);
  --shadow-h: 0 1px 0 rgba(255,255,255,.07) inset, 0 34px 64px -24px rgba(0,0,0,.85), 0 0 0 1px rgba(16,185,129,.22);
  --spot: rgba(16,185,129,.11); --tip-bg: rgba(9,15,13,.94); --noise: .05; --ped-shadow: rgba(0,0,0,.6);
  color-scheme: dark;
}
html[data-theme="light"] {
  --bg: #eef3f1; --bg-2: #f9fbfa;
  --surface: rgba(255,255,255,.72); --surface-solid: #ffffff; --surface-2: rgba(15,23,42,.03); --surface-3: rgba(15,23,42,.07);
  --side-bg: rgba(255,255,255,.62); --drawer-bg: rgba(255,255,255,.95);
  --line: rgba(15,23,42,.07); --line-2: rgba(15,23,42,.12);
  --edge-1: rgba(255,255,255,1); --edge-2: rgba(15,23,42,.035); --edge-3: rgba(16,185,129,.32);
  --text: #0b1713; --text-2: #485a54; --muted: #7a8b85;
  --c-temp: #ea580c; --c-soil: #059669; --c-light: #d97706;
  --grid-1: rgba(15,23,42,.045); --grid-2: rgba(15,23,42,.085);
  --glow-1: rgba(16,185,129,.17); --glow-2: rgba(20,184,166,.12); --glow-3: rgba(56,189,248,.10);
  --shadow: 0 1px 2px rgba(15,23,42,.04), 0 20px 44px -22px rgba(15,23,42,.22);
  --shadow-h: 0 2px 4px rgba(15,23,42,.05), 0 30px 60px -22px rgba(15,23,42,.3), 0 0 0 1px rgba(16,185,129,.28);
  --spot: rgba(16,185,129,.08); --tip-bg: rgba(255,255,255,.97); --noise: .035; --ped-shadow: rgba(15,23,42,.28);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
::selection { background: rgba(16,185,129,.3); }
.tab { font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
html.theming, html.theming * { transition: background-color .45s var(--ease), border-color .45s, color .45s, fill .45s, stroke .45s !important; }
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }

/* ================= Background ================= */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: radial-gradient(1200px 700px at 50% -12%, var(--bg-2), transparent 70%); }
.bg-grid { position: absolute; inset: -120px;
  background-image:
    linear-gradient(var(--grid-2) 1px, transparent 1px), linear-gradient(90deg, var(--grid-2) 1px, transparent 1px),
    linear-gradient(var(--grid-1) 1px, transparent 1px), linear-gradient(90deg, var(--grid-1) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
  -webkit-mask-image: radial-gradient(ellipse 75% 70% at 50% 30%, #000 30%, transparent 100%);
          mask-image: radial-gradient(ellipse 75% 70% at 50% 30%, #000 30%, transparent 100%);
  animation: gridPan 90s linear infinite; }
@keyframes gridPan { to { transform: translate3d(120px, 120px, 0); } }
.bg-glow { position: absolute; border-radius: 50%; filter: blur(70px); }
.g1 { width: 760px; height: 760px; left: -220px; top: -300px; background: var(--glow-1); animation: f1 24s ease-in-out infinite alternate; }
.g2 { width: 680px; height: 680px; right: -240px; bottom: -300px; background: var(--glow-2); animation: f2 28s ease-in-out infinite alternate; }
.g3 { width: 520px; height: 520px; left: 52%; top: 18%; background: var(--glow-3); animation: f3 32s ease-in-out infinite alternate; }
@keyframes f1 { to { transform: translate3d(120px, 80px, 0) scale(1.1); } }
@keyframes f2 { to { transform: translate3d(-140px, -60px, 0) scale(1.05); } }
@keyframes f3 { to { transform: translate3d(-160px, 120px, 0) scale(.9); } }
.bg-cursor { position: absolute; left: 0; top: 0; width: 640px; height: 640px; border-radius: 50%; background: radial-gradient(circle, var(--glow-1), transparent 62%); opacity: .55; transform: translate3d(-999px, -999px, 0); transition: transform .9s var(--ease); }
.bg-noise { position: absolute; inset: 0; opacity: var(--noise); mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.mark { position: absolute; width: 22px; height: 22px; border: 1px solid var(--grid-2); }
.mark.tl { top: 18px; left: calc(var(--side-w, 256px) + 18px); border-right: 0; border-bottom: 0; }
.mark.tr { top: 18px; right: 18px; border-left: 0; border-bottom: 0; }
.mark.bl { bottom: 18px; left: calc(var(--side-w, 256px) + 18px); border-right: 0; border-top: 0; }
.mark.br { bottom: 18px; right: 18px; border-left: 0; border-top: 0; }

/* ================= Layout ================= */
:root { --side-w: 256px; }
.app { position: relative; z-index: 1; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 22px; padding: 22px 16px 18px; background: var(--side-bg); border-right: 1px solid var(--line); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); z-index: 5; }
.brand { display: flex; align-items: center; gap: 12px; padding: 2px 8px 4px; }
.logo { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; color: #fff; font-size: 18px; background: var(--grad); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 12px 26px -8px rgba(16,185,129,.7); transition: transform .6s var(--spring); flex-shrink: 0; }
.brand:hover .logo { transform: rotate(-12deg) scale(1.07); }
.brand b { display: block; font-size: 16px; font-weight: 700; letter-spacing: -.015em; }
.brand small { display: block; font-size: 11.5px; color: var(--muted); }
.nav-label { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); padding: 0 14px; margin-bottom: -10px; }
.nav { position: relative; display: flex; flex-direction: column; gap: 4px; }
.nav-ind { position: absolute; left: 0; right: 0; top: 0; height: 46px; border-radius: 13px; background: linear-gradient(135deg, rgba(16,185,129,.17), rgba(20,184,166,.05)); box-shadow: inset 0 0 0 1px rgba(16,185,129,.28); transition: transform .55s var(--spring); pointer-events: none; }
.nav-ind::before { content: ''; position: absolute; left: -16px; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--grad); box-shadow: 0 0 14px rgba(16,185,129,.9); }
.nav-i { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px; border-radius: 13px; color: var(--text-2); font-size: 14px; font-weight: 500; text-align: left; transition: color .25s, background .25s; overflow: hidden; }
.nav-i i { width: 20px; text-align: center; font-size: 16px; transition: transform .45s var(--spring), color .25s; }
.nav-i:hover { color: var(--text); background: var(--surface-2); }
.nav-i:hover i { transform: scale(1.15) rotate(-8deg); }
.nav-i.on { color: var(--text); font-weight: 600; background: transparent; }
.nav-i.on i { color: var(--brand); }
.nav-i .badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--grad); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; font-style: normal; box-shadow: 0 4px 12px rgba(16,185,129,.45); animation: pop .45s var(--spring); }
.nav-i .badge[hidden] { display: none; }
.side-card { margin-top: auto; position: relative; padding: 16px; border-radius: 18px; background: linear-gradient(160deg, rgba(16,185,129,.17), rgba(20,184,166,.03)); border: 1px solid rgba(16,185,129,.24); overflow: hidden; transition: background .4s, border-color .4s; }
.side-card::after { content: ''; position: absolute; right: -40px; top: -40px; width: 130px; height: 130px; border-radius: 50%; background: radial-gradient(circle, rgba(16,185,129,.35), transparent 70%); pointer-events: none; }
.sc-top { display: flex; align-items: center; gap: 9px; font-size: 13px; }
.sc-sub { font-size: 12px; color: var(--text-2); margin: 4px 0 12px; }
.sc-btn { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--brand); }
.sc-btn i { transition: transform .35s var(--spring); }
.sc-btn:hover i { transform: translateX(4px); }
.side-card.manual { background: linear-gradient(160deg, rgba(245,158,11,.17), rgba(245,158,11,.03)); border-color: rgba(245,158,11,.3); }
.side-card.manual::after { background: radial-gradient(circle, rgba(245,158,11,.3), transparent 70%); }
.side-card.manual .pulse { background: #f59e0b; animation-name: pingA; }
.side-card.manual .sc-btn { color: #f59e0b; }
.side-foot { font-size: 11px; color: var(--muted); padding: 0 8px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--brand); flex-shrink: 0; animation: ping 2s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.6); } 70% { box-shadow: 0 0 0 8px rgba(16,185,129,0); } 100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); } }
@keyframes pingA { 0% { box-shadow: 0 0 0 0 rgba(245,158,11,.6); } 70% { box-shadow: 0 0 0 8px rgba(245,158,11,0); } 100% { box-shadow: 0 0 0 0 rgba(245,158,11,0); } }

.main { min-width: 0; padding: 22px 34px 60px; }
.wrap { max-width: 1320px; margin: 0 auto; }

/* ================= Top bar ================= */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.greet { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
.greet i { color: var(--c-light); }
.today { font-size: 15px; font-weight: 600; margin-top: 2px; }
.top-r { display: flex; align-items: center; gap: 10px; }
.chip { height: 42px; padding: 0 15px; border-radius: 13px; display: inline-flex; align-items: center; gap: 9px; background: var(--surface); border: 1px solid var(--line); backdrop-filter: blur(14px); font-size: 13.5px; font-weight: 600; color: var(--text-2); }
.chip i { color: var(--brand); }
.ibtn { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); backdrop-filter: blur(14px); color: var(--text-2); font-size: 13px; font-weight: 700; position: relative; overflow: hidden; transition: transform .4s var(--spring), color .25s, border-color .25s, box-shadow .3s; }
.ibtn:hover { color: var(--text); border-color: rgba(16,185,129,.45); box-shadow: 0 10px 22px -10px rgba(16,185,129,.7); }
.ibtn.sm { width: 34px; height: 34px; border-radius: 10px; font-size: 12px; }
.theme-btn i { position: absolute; font-size: 15px; transition: transform .6s var(--spring), opacity .3s; }
html[data-theme="dark"] .theme-btn .fa-sun { transform: translateY(26px) rotate(-90deg); opacity: 0; }
html[data-theme="light"] .theme-btn .fa-moon { transform: translateY(-26px) rotate(90deg); opacity: 0; }
.status { height: 42px; padding: 0 15px; border-radius: 13px; display: inline-flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; color: var(--brand); background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.26); }

/* ================= Page header ================= */
.page { display: none; }
.page.on { display: block; }
.ph { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; margin: 30px 0 22px; }
.ph h1 { margin: 0; font-size: 32px; line-height: 1.2; font-weight: 700; letter-spacing: -.03em; }
.grad-t { background: linear-gradient(110deg, var(--text) 35%, #14b8a6 80%, #6ee7b7); -webkit-background-clip: text; background-clip: text; color: transparent; }
.ph p { margin: 6px 0 0; color: var(--text-2); font-size: 14px; }
.ph-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mode { display: flex; align-items: center; gap: 14px; }
.mode-tx { font-size: 12.5px; color: var(--text-2); max-width: 230px; text-align: right; }

/* ================= Segmented control ================= */
.seg { position: relative; display: inline-flex; padding: 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); backdrop-filter: blur(14px); }
.seg button { position: relative; z-index: 1; height: 38px; padding: 0 18px; border-radius: 10px; font-size: 13px; font-weight: 600; color: var(--text-2); display: inline-flex; align-items: center; gap: 8px; transition: color .3s; overflow: hidden; white-space: nowrap; }
.seg button:hover { color: var(--text); }
.seg button.on { color: #fff; }
.seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: 0; border-radius: 10px; background: var(--grad); box-shadow: 0 8px 20px -6px rgba(16,185,129,.65), inset 0 1px 0 rgba(255,255,255,.25); transition: transform .5s var(--spring), width .5s var(--spring), background .4s; }
.seg.manual .thumb { background: linear-gradient(135deg, #f59e0b, #f97316); box-shadow: 0 8px 20px -6px rgba(245,158,11,.7), inset 0 1px 0 rgba(255,255,255,.25); }
.seg.sm button { height: 32px; padding: 0 13px; font-size: 12px; }
.live { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; animation: pingR 1.6s infinite; }
@keyframes pingR { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,.6); } 70% { box-shadow: 0 0 0 6px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }

/* ================= Grid + cards ================= */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 20px; }
.grid > * { min-width: 0; }
.c-3 { grid-column: span 3; } .c-4 { grid-column: span 4; } .c-6 { grid-column: span 6; } .c-8 { grid-column: span 8; } .c-12 { grid-column: span 12; }
.card { position: relative; isolation: isolate; border-radius: var(--r-lg); background: var(--surface); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); box-shadow: var(--shadow); padding: 24px; transition: transform .5s var(--ease), box-shadow .5s var(--ease); }
.card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(145deg, var(--edge-1), var(--edge-2) 38%, var(--edge-2) 62%, var(--edge-3));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
.card::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1; opacity: 0; transition: opacity .4s;
  background: radial-gradient(280px circle at var(--mx, 50%) var(--my, 50%), var(--spot), transparent 62%); }
.card:hover::after { opacity: 1; }
.card:hover { box-shadow: var(--shadow-h); }
.lift:hover { transform: translateY(-5px); }
.ch { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.ch h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.ch p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
.tile { --acc: var(--brand); width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; font-size: 17px; flex-shrink: 0; color: var(--acc);
  background: color-mix(in srgb, var(--acc) 13%, transparent); border: 1px solid color-mix(in srgb, var(--acc) 26%, transparent); transition: transform .5s var(--spring), background .3s, color .3s, box-shadow .3s; }
.state { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.state.ok { color: var(--brand); background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.26); }
.state.warn { color: #f59e0b; background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.3); }
.latin { font-size: 12.5px; font-style: italic; color: var(--muted); }

/* ================= Buttons ================= */
.btn { height: 44px; padding: 0 18px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; font-size: 13.5px; font-weight: 600; position: relative; overflow: hidden; white-space: nowrap; transition: transform .4s var(--spring), box-shadow .3s, background .3s, border-color .3s, color .3s; }
.btn.primary { color: #fff; background: var(--grad); box-shadow: 0 12px 26px -12px rgba(16,185,129,.9), inset 0 1px 0 rgba(255,255,255,.25); }
.btn.primary::before { content: ''; position: absolute; top: 0; bottom: 0; width: 45%; left: -70%; background: linear-gradient(100deg, transparent, rgba(255,255,255,.4), transparent); transform: skewX(-20deg); transition: left .75s var(--ease); }
.btn.primary:hover::before { left: 135%; }
.btn.primary:hover { box-shadow: 0 18px 34px -12px rgba(16,185,129,1), inset 0 1px 0 rgba(255,255,255,.3); }
.btn.ghost { background: var(--surface-2); border: 1px solid var(--line-2); color: var(--text); }
.btn.ghost:hover { border-color: rgba(16,185,129,.45); background: var(--surface-3); }
.btn.danger { color: #ef4444; background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.26); }
.btn.danger:hover { background: rgba(239,68,68,.16); }
.btn.sm { height: 36px; padding: 0 14px; font-size: 12.5px; border-radius: 11px; }
.btn:active, .ibtn:active, .fchip:active, .seg button:active, .bnav button:active { transform: scale(.95) !important; }
.ripple { position: absolute; border-radius: 50%; transform: scale(0); background: rgba(255,255,255,.35); animation: ripple .65s var(--ease) forwards; pointer-events: none; }
html[data-theme="light"] .ripple { background: rgba(16,185,129,.2); }
@keyframes ripple { to { transform: scale(2.6); opacity: 0; } }

/* ================= Hero ================= */
.hero { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; align-items: center; padding: 30px 32px; overflow: hidden; }
.hero-deco { position: absolute; right: -40px; bottom: -80px; font-size: 280px; color: var(--brand); opacity: .045; transform: rotate(-18deg); pointer-events: none; z-index: -1; transition: transform 1.2s var(--ease); }
.hero:hover .hero-deco { transform: rotate(-8deg) scale(1.05); }
.hero-art { position: relative; width: 200px; height: 200px; margin: 0 auto; display: grid; place-items: center; }
.hero-art::before { content: ''; position: absolute; inset: -34px; border-radius: 50%; background: radial-gradient(circle, rgba(16,185,129,.38), transparent 64%); filter: blur(8px); animation: breathe 5s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.08); opacity: .75; } }
.ped { position: relative; width: 178px; height: 178px; border-radius: 50%; display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(circle at 50% 38%, #ffffff, #dde7e3 78%); box-shadow: inset 0 -12px 30px rgba(0,0,0,.08), 0 28px 44px -20px var(--ped-shadow); transition: transform .8s var(--spring); }
.ped img { width: 86%; height: 86%; object-fit: contain; mix-blend-mode: multiply; transform: translateY(6px); }
.hero:hover .ped { transform: translateY(-8px) rotate(-3deg) scale(1.02); }
.orbit { position: absolute; inset: -8px; border-radius: 50%; border: 1px dashed color-mix(in srgb, var(--brand) 50%, transparent); animation: spin 40s linear infinite; }
.orbit.o2 { inset: -24px; border-style: solid; border-color: color-mix(in srgb, var(--brand) 14%, transparent); animation-duration: 64s; animation-direction: reverse; }
.orbit::after { content: ''; position: absolute; top: 50%; right: -4px; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 14px var(--mint); }
.orbit.o2::after { top: 14%; right: 12%; width: 6px; height: 6px; background: var(--brand-2); box-shadow: 0 0 12px var(--brand-2); }
.p-art { width: 100%; height: 100%; display: grid; place-items: center; font-size: 64px; color: #10b981; background: radial-gradient(circle at 50% 38%, #f0fdf8, #c4ebdb 80%); }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px; border-radius: 999px; background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.26); color: var(--brand); font-size: 12px; font-weight: 600; }
.hero h2 { margin: 14px 0 0; font-size: 36px; line-height: 1.15; font-weight: 700; letter-spacing: -.03em; }
.hero .latin { font-size: 14px; margin-top: 2px; }
.hero-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 22px 0 22px; }
.hm { padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); transition: transform .4s var(--spring), border-color .25s; }
.hm:hover { transform: translateY(-3px); border-color: rgba(16,185,129,.38); }
.hm small { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }
.hm b { font-size: 15px; font-weight: 700; }
.hero-act { display: flex; gap: 10px; flex-wrap: wrap; }

.pc-img:has(img.cover) { height: 250px; }
.pc-img img.cover { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; object-fit: cover; mix-blend-mode: normal; transition: transform .9s var(--ease); }
.pcard:hover .pc-img img.cover { transform: scale(1.06); }
.ped img.cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; mix-blend-mode: normal; transform: none; }
.pc-img:has(img.cover)::after { height: 55%; background: linear-gradient(transparent, rgba(0,0,0,.35)); }
.ben { font-size: 12.5px; line-height: 1.55; color: var(--text-2); padding: 10px 12px; border-radius: 12px; background: rgba(16,185,129,.07); border: 1px solid rgba(16,185,129,.18); display: flex; gap: 8px; }
.ben i { color: var(--brand); margin-top: 3px; }
.hero .ben { margin-top: 14px; }
/* ================= Health ================= */
.health { display: flex; flex-direction: column; }
.ring-wrap { position: relative; width: 196px; height: 196px; margin: 0 auto 18px; transition: transform .6s var(--spring); }
.health:hover .ring-wrap { transform: scale(1.04) rotate(4deg); }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.r-ticks { fill: none; stroke: var(--line-2); stroke-width: 6; stroke-dasharray: 1.5 8.553; }
.r-track { fill: none; stroke: var(--surface-3); stroke-width: 14; }
.r-val { fill: none; stroke-width: 14; stroke-linecap: round; stroke-dasharray: 502.65; stroke-dashoffset: 502.65; transition: stroke-dashoffset 1.5s var(--ease); filter: drop-shadow(0 0 10px rgba(16,185,129,.5)); }
html[data-theme="light"] .r-val { filter: drop-shadow(0 4px 8px rgba(16,185,129,.28)); }
.ring-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring-c .big { font-size: 52px; font-weight: 700; letter-spacing: -.045em; line-height: 1; }
.ring-c .big .pc { font-size: 20px; color: var(--muted); margin-left: 2px; letter-spacing: 0; }
.ring-c small { font-size: 12px; color: var(--muted); margin-top: 6px; }
.hrows { display: grid; gap: 8px; margin-top: auto; }
.hrow { --acc: var(--brand); display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; transition: transform .4s var(--spring), border-color .25s; }
.hrow:hover { transform: translateX(4px); border-color: color-mix(in srgb, var(--acc) 40%, transparent); }
.hrow .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 22%, transparent); }
.hrow span { flex: 1; color: var(--text-2); }
.hrow b { font-weight: 600; }
.hrow b.ok { color: var(--brand); } .hrow b.warn { color: #f59e0b; }

/* ================= Sensors ================= */
.sensors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.s-temp { --acc: var(--c-temp); } .s-soil { --acc: var(--c-soil); } .s-light { --acc: var(--c-light); }
.sensor { overflow: hidden; transform-style: preserve-3d; will-change: transform; }
.acc { position: absolute; top: 0; left: 26px; right: 26px; height: 2px; border-radius: 0 0 3px 3px; background: linear-gradient(90deg, transparent, var(--acc), transparent); }
.sn-h { display: flex; align-items: center; gap: 12px; }
.sn-t { flex: 1; min-width: 0; }
.sn-t b { display: block; font-size: 14.5px; font-weight: 600; }
.sn-t small { font-size: 12px; color: var(--muted); }
.sensor:hover .tile { transform: translateZ(24px) rotate(-10deg) scale(1.1); background: var(--acc); color: #fff; box-shadow: 0 10px 22px -8px var(--acc); }
.sn-v { display: flex; align-items: baseline; gap: 6px; margin: 22px 0 6px; transition: transform .4s var(--ease); }
.sensor:hover .sn-v { transform: translateZ(16px); }
.sn-v .num { font-size: 48px; font-weight: 700; letter-spacing: -.045em; line-height: 1; }
.sn-v .u { font-size: 17px; font-weight: 600; color: var(--acc); }
.sn-d { font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 7px; }
.sn-d i { color: var(--acc); }
.track { position: relative; height: 8px; border-radius: 999px; background: var(--surface-3); margin: 20px 0 8px; }
.track .band { position: absolute; top: 0; bottom: 0; border-radius: inherit; background: color-mix(in srgb, var(--acc) 32%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--acc) 45%, transparent); transition: left .5s var(--ease), width .5s var(--ease); }
.track .mk { position: absolute; top: 50%; left: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--surface-solid); border: 4px solid var(--acc); box-shadow: 0 0 0 5px color-mix(in srgb, var(--acc) 20%, transparent), 0 4px 10px rgba(0,0,0,.3); transition: left 1s var(--ease); }
.track-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.spark { display: block; width: 100%; height: 56px; margin-top: 16px; color: var(--acc); overflow: visible; }
.spark .sd { filter: drop-shadow(0 0 6px currentColor); }
.spark .sr { fill: none; stroke: currentColor; stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: sr 2s ease-out infinite; }
@keyframes sr { from { transform: scale(1); opacity: .8; } to { transform: scale(3.2); opacity: 0; } }

/* ================= Chart ================= */
.legend { display: flex; gap: 8px; flex-wrap: wrap; margin: -4px 0 16px; }
.legend.hide { visibility: hidden; height: 0; margin: 0; }
.lg { height: 32px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); transition: opacity .3s, border-color .25s, transform .35s var(--spring); }
.lg:hover { border-color: var(--c); transform: translateY(-2px); }
.lg i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); transition: all .3s; }
.lg.off { opacity: .45; }
.lg.off i { background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.chart-wrap { position: relative; height: 310px; }

/* ================= Devices ================= */
.dev-list { display: grid; gap: 10px; }
.dev { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); cursor: pointer; position: relative; text-align: left; width: 100%;
  transition: transform .45s var(--spring), border-color .3s, background .3s, box-shadow .3s; }
.dev:hover { transform: translateY(-3px); border-color: var(--line-2); box-shadow: 0 16px 30px -18px rgba(0,0,0,.55); }
.dev-ic { position: relative; width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; font-size: 17px; background: var(--surface-3); color: var(--text-2); flex-shrink: 0; transition: background .4s, color .4s, box-shadow .4s; }
.dev-ic .io { position: absolute; right: -6px; bottom: -6px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 8.5px; background: var(--surface-solid); border: 1px solid var(--line-2); color: var(--text-2); }
.dev-tx { flex: 1; min-width: 0; }
.dev-tx b { display: block; font-size: 14px; font-weight: 600; }
.dev-tx small { font-size: 12px; color: var(--muted); transition: color .3s; }
.dev.on { border-color: rgba(16,185,129,.4); background: linear-gradient(135deg, rgba(16,185,129,.14), rgba(20,184,166,.03)); }
.dev.on .dev-ic { background: var(--grad); color: #fff; box-shadow: 0 10px 20px -8px rgba(16,185,129,.8); }
.dev.on .dev-tx small { color: var(--brand); }
.dev.lamp.on { border-color: rgba(245,158,11,.42); background: linear-gradient(135deg, rgba(245,158,11,.14), rgba(245,158,11,.02)); }
.dev.lamp.on .dev-ic { background: linear-gradient(135deg, #fbbf24, #f59e0b); animation: lamp 2.6s ease-in-out infinite; }
.dev.lamp.on .dev-tx small { color: #f59e0b; }
@keyframes lamp { 0%,100% { box-shadow: 0 8px 20px -6px rgba(245,158,11,.75); } 50% { box-shadow: 0 8px 30px 0 rgba(245,158,11,.65); } }
.dev.on .fa-fan { animation: spin 1.3s linear infinite; }
.dev.on.fanOut .fa-fan { animation-direction: reverse; }
.dev:not(.on):hover .fa-fan { animation: spin 2.4s linear infinite; }
.dev.on .fa-faucet-drip { animation: drip 1.1s ease-in-out infinite; }
.dev:hover .fa-lightbulb { animation: flick 1.4s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes drip { 50% { transform: translateY(3px); } }
@keyframes flick { 50% { opacity: .55; } }
.sw { width: 48px; height: 28px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--line-2); position: relative; flex-shrink: 0; transition: background .35s, box-shadow .35s; }
.sw .knob { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); display: grid; place-items: center; font-size: 8.5px; color: #7a8b85; transition: transform .5s var(--spring); }
.dev.on .sw { background: var(--grad); border-color: transparent; box-shadow: 0 6px 16px -6px rgba(16,185,129,.8); }
.dev.lamp.on .sw { background: linear-gradient(135deg, #fbbf24, #f59e0b); box-shadow: 0 6px 16px -6px rgba(245,158,11,.8); }
.dev.on .sw .knob { transform: translateX(20px); }
.dev.shake { animation: shake .45s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.lockbar { display: none; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 12px; border-radius: 14px; background: rgba(16,185,129,.07); border: 1px dashed rgba(16,185,129,.38); font-size: 12.5px; color: var(--text-2); }
.lockbar i { color: var(--brand); }
.lockbar span { flex: 1; }
.lockbar button { font-size: 12px; font-weight: 700; color: var(--brand); white-space: nowrap; }
.lockbar button:hover { text-decoration: underline; }
.locked .lockbar { display: flex; animation: rise .4s var(--ease); }
.mb { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; height: 24px; padding: 0 9px; display: inline-flex; align-items: center; border-radius: 8px; border: 1px solid; white-space: nowrap; }
.mb.auto { color: var(--brand-2); border-color: rgba(20,184,166,.36); background: rgba(20,184,166,.08); }
.mb.manual { color: #f59e0b; border-color: rgba(245,158,11,.36); background: rgba(245,158,11,.08); }
.sched { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line-2); }
.sched-h { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--text-2); margin-bottom: 12px; }
.sched-h i { color: var(--c-light); margin-right: 4px; }
.sched-h b { color: var(--text); font-weight: 600; }
.sched-t { position: relative; height: 10px; border-radius: 999px; background: var(--surface-3); }
.sched-t .lit { position: absolute; top: 0; bottom: 0; border-radius: inherit; background: linear-gradient(90deg, #fcd34d, #f59e0b); box-shadow: 0 0 16px rgba(245,158,11,.45); }
.sched-t .nowm { position: absolute; top: -6px; width: 3px; height: 22px; margin-left: -1.5px; border-radius: 3px; background: var(--text); box-shadow: 0 0 0 3px var(--surface-solid); }
.sched-l { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 9px; }

/* ================= Plants ================= */
.search { position: relative; display: block; }
.search i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
.search input { height: 44px; width: 260px; padding: 0 14px 0 40px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); backdrop-filter: blur(14px); outline: none; font-size: 13.5px; transition: border-color .25s, box-shadow .25s, width .4s var(--ease); }
.search input:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(16,185,129,.15); width: 300px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
.pcard { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.pcard.active { box-shadow: var(--shadow), 0 0 0 1.5px rgba(16,185,129,.6), 0 24px 50px -24px rgba(16,185,129,.55); }
.pc-img { position: relative; height: 196px; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 50% 55%, #ffffff, #dbe6e1 78%); }
.pc-img::after { content: ''; position: absolute; inset: auto 0 0 0; height: 40%; background: linear-gradient(transparent, rgba(0,0,0,.06)); pointer-events: none; }
.pc-img img { height: 176px; width: auto; max-width: 92%; object-fit: contain; mix-blend-mode: multiply; transition: transform .8s var(--spring); }
.pcard:hover .pc-img img { transform: translateY(-6px) scale(1.07); }
.pc-img .p-art { font-size: 72px; background: radial-gradient(circle at 50% 45%, #effcf6, #bfe6d6 80%); background-image: radial-gradient(circle at 50% 45%, rgba(255,255,255,.9), rgba(255,255,255,0) 60%), linear-gradient(rgba(16,185,129,.12) 1px, transparent 1px), linear-gradient(90deg, rgba(16,185,129,.12) 1px, transparent 1px); background-size: auto, 22px 22px, 22px 22px; background-color: #d6f1e5; }
.pc-img .p-art i { transition: transform .8s var(--spring); filter: drop-shadow(0 10px 16px rgba(5,150,105,.3)); }
.pcard:hover .pc-img .p-art i { transform: translateY(-6px) rotate(-8deg) scale(1.08); }
.ribbon { position: absolute; top: 14px; left: 14px; z-index: 1; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--grad); color: #fff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 10px 20px -8px rgba(16,185,129,.8); }
.pc-b { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.pc-h { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; margin-bottom: 4px; }
.pc-h h3 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.015em; }
.ibtn.edit i { transition: transform .4s var(--spring); }
.ibtn.edit:hover i { transform: rotate(-18deg) scale(1.1); }
.rr { display: grid; grid-template-columns: 112px minmax(0, 1fr) 78px; align-items: center; gap: 12px; font-size: 12.5px; }
.rr span { display: inline-flex; align-items: center; gap: 8px; color: var(--text-2); }
.rr span i { color: var(--acc); width: 14px; text-align: center; }
.rr-t { position: relative; height: 6px; border-radius: 999px; background: var(--surface-3); }
.rr-t i { position: absolute; top: 0; bottom: 0; border-radius: inherit; background: var(--acc); box-shadow: 0 0 10px color-mix(in srgb, var(--acc) 55%, transparent); transform-origin: left; animation: grow-x .9s var(--ease) backwards; }
@keyframes grow-x { from { transform: scaleX(0); } }
.rr b { font-weight: 600; text-align: right; }
.pc-f { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 14px; border-top: 1px dashed var(--line-2); }
.pc-sched { font-size: 12.5px; color: var(--text-2); display: inline-flex; gap: 7px; align-items: center; }
.pc-sched i { color: var(--c-light); }
.pcard-add { min-height: 260px; border-radius: var(--r-lg); border: 1.5px dashed var(--line-2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-2); transition: border-color .3s, background .3s, transform .5s var(--ease); }
.pcard-add:hover { border-color: var(--brand); background: rgba(16,185,129,.05); transform: translateY(-5px); }
.pcard-add .plus { width: 58px; height: 58px; border-radius: 18px; display: grid; place-items: center; font-size: 22px; color: #fff; background: var(--grad); box-shadow: 0 14px 28px -10px rgba(16,185,129,.8); transition: transform .6s var(--spring); }
.pcard-add:hover .plus { transform: rotate(90deg) scale(1.08); }
.pcard-add b { font-size: 15px; color: var(--text); }
.pcard-add small { font-size: 12.5px; color: var(--muted); }
.nores { grid-column: 1 / -1; padding: 50px 20px; text-align: center; color: var(--muted); }

/* ================= History ================= */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
.kpi { display: flex; flex-direction: column; gap: 14px; transform-style: preserve-3d; }
.kpi-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.kpi-l { font-size: 13px; color: var(--text-2); font-weight: 500; }
.kpi:hover .tile { transform: rotate(-10deg) scale(1.1); background: var(--acc); color: #fff; }
.kpi-v { font-size: 36px; font-weight: 700; letter-spacing: -.04em; line-height: 1; }
.kpi-v small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.meter { height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, color-mix(in srgb, var(--acc) 45%, transparent), var(--acc)); transform-origin: left; animation: grow-x 1.1s var(--ease) backwards; }
.kpi-s { font-size: 12px; color: var(--muted); }
.hours { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 6px; height: 170px; }
.hcol { position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px; }
.hcol .bar { width: 100%; max-width: 24px; border-radius: 7px 7px 4px 4px; background: linear-gradient(180deg, #34d399, rgba(16,185,129,.22)); transform-origin: bottom; animation: grow-y .9s var(--ease) backwards; animation-delay: calc(var(--i) * 18ms); transition: filter .25s, transform .3s var(--spring); }
.hcol .bar.zero { background: var(--surface-3); }
.hcol.now .bar { background: linear-gradient(180deg, #fbbf24, rgba(245,158,11,.25)); }
.hcol span { font-size: 10.5px; color: var(--muted); height: 14px; line-height: 14px; }
.hcol:hover .bar { filter: brightness(1.25) saturate(1.2); transform: scaleX(1.12); }
.hcol::after { content: attr(data-tip); position: absolute; bottom: calc(100% - 6px); left: 50%; transform: translate(-50%, 6px); white-space: nowrap; font-size: 11.5px; font-weight: 600; padding: 6px 10px; border-radius: 9px; background: var(--tip-bg); border: 1px solid var(--line-2); color: var(--text); opacity: 0; pointer-events: none; transition: opacity .2s, transform .3s var(--spring); z-index: 3; box-shadow: 0 10px 24px -10px rgba(0,0,0,.5); }
.hcol:hover::after { opacity: 1; transform: translate(-50%, 0); }
@keyframes grow-y { from { transform: scaleY(0); } }
.ch-note { font-size: 12px; color: var(--text-2); display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.ch-note i { color: var(--c-light); }
.fchips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.fchip { --hue: var(--brand); height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); font-size: 12.5px; font-weight: 600; color: var(--text-2); display: inline-flex; align-items: center; gap: 8px; position: relative; overflow: hidden; transition: transform .35s var(--spring), border-color .25s, background .25s, color .25s, box-shadow .3s; }
.fchip i { color: var(--hue); transition: color .25s; }
.fchip:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--hue) 50%, transparent); color: var(--text); }
.fchip.on { background: var(--grad); color: #fff; border-color: transparent; box-shadow: 0 10px 20px -10px rgba(16,185,129,.9); }
.fchip.on i { color: #fff; }
.tl-day { display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 700; color: var(--text); margin: 22px 0 8px; }
.tl-day em { font-style: normal; font-weight: 500; color: var(--muted); }
.tl-day::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.tl-list { position: relative; }
.tl-list::before { content: ''; position: absolute; left: 107px; top: 10px; bottom: 10px; width: 2px; border-radius: 2px; background: linear-gradient(var(--line-2), transparent); }
.ev { --hue: var(--brand); position: relative; display: grid; grid-template-columns: 56px 44px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 16px; border: 1px solid transparent;
  transition: background .25s, border-color .25s, transform .4s var(--spring); animation: evIn .5s var(--ease) backwards; animation-delay: calc(var(--i) * 32ms); }

.empty i { display: block; font-size: 30px; margin-bottom: 10px; opacity: .6; }

/* ================= Drawer ================= */
.ov { position: fixed; inset: 0; z-index: 80; background: rgba(3,7,6,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .4s; }
.ov.show { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 12px; right: 12px; bottom: 12px; z-index: 90; width: min(470px, calc(100vw - 24px)); display: flex; flex-direction: column; border-radius: 26px; background: var(--drawer-bg); border: 1px solid var(--line-2); box-shadow: 0 40px 90px -30px rgba(0,0,0,.7); backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px); transform: translateX(calc(100% + 30px)); transition: transform .6s var(--spring); }
.drawer.show { transform: none; }
.dw-h { display: flex; align-items: center; gap: 14px; padding: 22px 22px 18px; border-bottom: 1px solid var(--line); }
.dw-h .f1 { flex: 1; min-width: 0; }

.fl { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; }
.cap { display: block; font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
.inp { width: 100%; height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface-2); outline: none; font-size: 14px; transition: border-color .25s, box-shadow .25s, background .25s; }
.inp:focus { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(16,185,129,.16); background: var(--surface); }

html[data-theme="dark"] .inp[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); }
.drop { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; border: 1.5px dashed var(--line-2); cursor: pointer; transition: border-color .25s, background .25s; }
.drop:hover, .drop.over { border-color: var(--brand); background: rgba(16,185,129,.06); }
.drop .thumb { width: 66px; height: 66px; border-radius: 16px; overflow: hidden; background: radial-gradient(circle at 50% 40%, #fff, #dbe6e1 80%); display: grid; place-items: center; flex-shrink: 0; color: #10b981; font-size: 26px; }
.drop .thumb img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
.drop b { display: block; font-size: 14px; }
.drop small { font-size: 12px; color: var(--muted); }

.drop:hover > i { transform: translateY(-3px); }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }

.fsec:focus-within { border-color: color-mix(in srgb, var(--acc, var(--brand)) 45%, transparent); }
.fsec-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 13.5px; font-weight: 600; }
.fsec-h i { color: var(--acc); width: 16px; text-align: center; }
.fsec-h em { margin-left: auto; font-style: normal; font-weight: 700; color: var(--acc); font-size: 13px; }
.fsec .track { margin: 14px 0 2px; }
.fsec.bad .fsec-h em { color: #ef4444; }
.fsec.bad .band { background: rgba(239,68,68,.3); box-shadow: inset 0 0 0 1px rgba(239,68,68,.5); }
.step { display: flex; align-items: center; height: 44px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface); overflow: hidden; transition: border-color .25s, box-shadow .25s; }
.step:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(16,185,129,.16); }
.step button { width: 38px; height: 100%; color: var(--text-2); font-size: 11px; transition: background .2s, color .2s; flex-shrink: 0; }
.step button:hover { background: var(--surface-3); color: var(--text); }
.step input { flex: 1; min-width: 0; width: 100%; height: 100%; border: 0; background: transparent; text-align: center; font-weight: 700; font-size: 15px; outline: none; -moz-appearance: textfield; font-variant-numeric: tabular-nums; }

/* ================= Toasts ================= */
.toasts { position: fixed; right: 24px; bottom: 24px; z-index: 100; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 15px; background: var(--drawer-bg); border: 1px solid var(--line-2); box-shadow: 0 22px 44px -16px rgba(0,0,0,.55); backdrop-filter: blur(20px); font-size: 13.5px; font-weight: 500; max-width: 400px; animation: toastIn .55s var(--spring); }

@keyframes toastIn { from { opacity: 0; transform: translateY(16px) scale(.95); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(30px); } }

/* ================= Motion helpers ================= */
.rise { animation: rise .7s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }

    const se = $('[data-state]', card);

    se.innerHTML = `<i class="fas ${st === 'ok' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i>${t(st)}`;

    const last = pts[pts.length - 1];

function simulate() {
  const s = S.sensors, d = S.dev, fans = (d.fanIn.on ? 1 : 0) + (d.fanOut.on ? 1 : 0);
  s.temp = clamp(s.temp + ((29.6 - fans * .55) - s.temp) * .06 + (Math.random() - .5) * .18, 10, 45);
  s.soil = clamp(s.soil + ((d.pump.on ? 72 : 46) - s.soil) * (d.pump.on ? .12 : .03) + (Math.random() - .5) * .45, 0, 100);
  s.light = clamp(s.light + ((d.lamp.on ? 71 : 9) - s.light) * .25 + (Math.random() - .5) * 1.4, 0, 100);
  for (const k in SEN) { S.spark[k].push(+s[k].toFixed(2)); if (S.spark[k].length > 24) S.spark[k].shift(); }
  const n = new Date();
  RT.labels.push(`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`); RT.labels.shift();
  RT.temp.push(+s.temp.toFixed(1)); RT.temp.shift();
  RT.soil.push(Math.round(s.soil)); RT.soil.shift();

function rangeRow(p, k) {
  const m = SEN[k], r = p[k];
  return `<div class="rr ${m.cls}"><span><i class="fas ${m.icon}"></i>${t(k)}</span><div class="rr-t"><i style="left:${r[0] / m.max * 100}%;width:${(r[1] - r[0]) / m.max * 100}%"></i></div><b class="tab">${r[0]}–${r[1]}${m.unit}</b></div>`;
}
function renderPlants() {
  const q = ($('#plantSearch').value || '').trim().toLowerCase();
  const list = S.plants.filter(p => !q || [p.name.th, p.name.en, p.latin].some(x => (x || '').toLowerCase().includes(q)));
  const cards = list.map((p, i) => {
    const act = p.id === S.active;
    return `<article class="card pcard lift rise ${act ? 'active' : ''}" style="--i:${i + 1}">
      <div class="pc-img">${avatar(p)}${act ? `<span class="ribbon"><i class="fas fa-check"></i>${t('inUse')}</span>` : ''}</div>
      <div class="pc-b">
        <div class="pc-h"><div><h3>${esc(L(p.name))}</h3><div class="latin">${esc(p.latin || '')}</div></div><button class="ibtn sm edit" data-edit="${p.id}" aria-label="${t('editPlant')}"><i class="fas fa-pen"></i></button></div>
        ${p.ben ? `<div class="ben"><i class="fas fa-heart-pulse"></i><span>${esc(L(p.ben))}</span></div>` : ''}
        ${Object.keys(SEN).map(k => rangeRow(p, k)).join('')}
        <div class="pc-f"><span class="pc-sched"><i class="fas fa-lightbulb"></i><span class="tab">${p.on}–${p.off}</span></span>
          ${act ? `<span class="state ok"><i class="fas fa-circle-check"></i>${t('inUse')}</span>` : `<button class="btn sm primary" data-use="${p.id}">${t('use')}</button>`}</div>
      </div>
    </article>`;
  }).join('');
  $('#plantGrid').innerHTML = (cards || `<div class="nores"><i class="fas fa-seedling"></i> ${t('noMatch')}</div>`) +
    `<button class="pcard-add rise" data-add style="--i:${list.length + 1}"><span class="plus"><i class="fas fa-plus"></i></span><b>${t('newPlant')}</b><small>${t('newPlantSub')}</small></button>`;
}
function usePlant(id) {
  const p = S.plants.find(x => x.id === id); if (!p) return;
  S.active = id;
  if (!p.planted) p.planted = Date.now();
  renderPlants(); renderDash();
  toast(t('tUsing', { p: L(p.name) }), 'ok', 'fa-seedling');
}

/* ---------------- drawer ---------------- */
let editing = null, draftImg = null;
function buildFsecs() {
  $('#fsecs').innerHTML = Object.keys(SEN).map(k => `
    <div class="fsec ${SEN[k].cls}" data-k="${k}" style="margin-bottom:18px">
      <div class="fsec-h"><i class="fas ${SEN[k].icon}"></i><span data-i18n="${SEN[k].rk}"></span><em id="pv-${k}-tx" class="tab"></em></div>
      <div class="pair">
        <div><span class="cap" data-i18n="lo"></span><div class="step"><button type="button" data-step="f-${k}-lo" data-d="-1" aria-label="-"><i class="fas fa-minus"></i></button><input type="number" id="f-${k}-lo" inputmode="decimal"><button type="button" data-step="f-${k}-lo" data-d="1" aria-label="+"><i class="fas fa-plus"></i></button></div></div>
        <div><span class="cap" data-i18n="hi"></span><div class="step"><button type="button" data-step="f-${k}-hi" data-d="-1" aria-label="-"><i class="fas fa-minus"></i></button><input type="number" id="f-${k}-hi" inputmode="decimal"><button type="button" data-step="f-${k}-hi" data-d="1" aria-label="+"><i class="fas fa-plus"></i></button></div></div>
      </div>
      <div class="track"><div class="band" id="pv-${k}"></div></div>
    </div>`).join('');
}
function updatePreviews() {
  for (const k in SEN) {
    const m = SEN[k], lo = parseFloat($(`#f-${k}-lo`).value), hi = parseFloat($(`#f-${k}-hi`).value);
    const ok = !isNaN(lo) && !isNaN(hi) && lo < hi;
    $(`.fsec[data-k="${k}"]`).classList.toggle('bad', !ok);
    $(`#pv-${k}-tx`).textContent = isNaN(lo) || isNaN(hi) ? '—' : `${lo}–${hi}${m.unit}`;
    const a = clamp(isNaN(lo) ? 0 : lo, 0, m.max), b = clamp(isNaN(hi) ? 0 : hi, 0, m.max);
    $(`#pv-${k}`).style.left = (Math.min(a, b) / m.max * 100) + '%';
    $(`#pv-${k}`).style.width = (Math.abs(b - a) / m.max * 100) + '%';
  }
}
function setThumb() { const p = editing ? S.plants.find(x => x.id === editing) : null; $('#dropThumb').innerHTML = draftImg ? `<img src="${draftImg}" alt="">` : `<i class="fas ${p ? p.icon : 'fa-seedling'}"></i>`; }
function openDrawer(id) {
  editing = id;
  const p = id ? S.plants.find(x => x.id === id) : { name: { th: '', en: '' }, latin: '', img: null, temp: [22, 30], soil: [45, 65], light: [60, 80], on: '06:00', off: '18:00' };
  draftImg = p.img;
  $('#dwTitle').textContent = t(id ? 'editPlant' : 'newPlant');
  $('#dwSub').textContent = id ? L(p.name) : t('newPlantSub');
  $('#fName').value = id ? L(p.name) : '';
  $('#fLatin').value = p.latin || '';
  for (const k in SEN) { $(`#f-${k}-lo`).value = p[k][0]; $(`#f-${k}-hi`).value = p[k][1]; }
  $('#fOn').value = p.on; $('#fOff').value = p.off;
  $('#fDel').style.visibility = id ? 'visible' : 'hidden';
  setThumb(); updatePreviews();
  const body = $('#dwBody'); body.classList.remove('show-in'); void body.offsetWidth; body.classList.add('show-in');
  $$('#dwBody > *').forEach((el, i) => el.style.animationDelay = (i * 50 + 120) + 'ms');
  $('#ov').classList.add('show'); $('#drawer').classList.add('show'); $('#drawer').setAttribute('aria-hidden', 'false');
  setTimeout(() => $('#fName').focus({ preventScroll: true }), 450);
}
function closeDrawer() { $('#ov').classList.remove('show'); $('#drawer').classList.remove('show'); $('#drawer').setAttribute('aria-hidden', 'true'); }
function savePlant() {
  const name = $('#fName').value.trim();
  if (!name) { toast(t('tName'), 'warn'); $('#fName').focus(); return; }
  const vals = {};
  for (const k in SEN) {
    const lo = parseFloat($(`#f-${k}-lo`).value), hi = parseFloat($(`#f-${k}-hi`).value);
    if (isNaN(lo) || isNaN(hi) || lo >= hi) { toast(t('tBad'), 'warn'); return; }
    vals[k] = [lo, hi];
  }
  let p;
  if (editing) {
    p = S.plants.find(x => x.id === editing);
    p.name = Object.assign({}, p.name, { [lang]: name });
  } else {
    p = { id: 'p' + Date.now(), name: { th: name, en: name }, icon: 'fa-seedling', planted: null };
    S.plants.push(p);
  }
  Object.assign(p, vals, { latin: $('#fLatin').value.trim(), img: draftImg, on: $('#fOn').value || '06:00', off: $('#fOff').value || '18:00' });
  closeDrawer(); renderPlants();
  if (p.id === S.active) renderDash();
  toast(t(editing ? 'tSaved' : 'tAdded', { p: L(p.name) }), 'ok', 'fa-floppy-disk');
}
function deletePlant() {
  if (!editing) return;
  if (editing === S.active) { toast(t('tCantDel'), 'warn'); return; }
  const p = S.plants.find(x => x.id === editing);
  S.plants = S.plants.filter(x => x.id !== editing);
  closeDrawer(); renderPlants();
  toast(t('tDeleted', { p: L(p.name) }), 'ok', 'fa-trash-can');
}
function readPhoto(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const r = new FileReader();
  r.onload = e => { draftImg = e.target.result; setThumb(); };
  r.readAsDataURL(file);
}

/* =====================================================================
   HISTORY
   ===================================================================== */
function whyHTML(e) {
  if (e.why.s === 'user') return `<span class="why user"><i class="fas fa-hand-pointer"></i>${t('byUser')}</span>`;
  if (e.why.s === 'clock') return `<span class="why clock"><i class="fas fa-clock"></i>${L(e.why)}</span>`;
  const m = SEN[e.why.s];
  return `<span class="why ${m.cls}"><i class="fas ${m.icon}"></i>${L(e.why)}</span>`;
}
function renderHist() {
  const d0 = startOfDay(Date.now()), d1 = d0 - 864e5;
  const today = S.hist.filter(e => e.ts >= d0), yest = S.hist.filter(e => e.ts >= d1 && e.ts < d0);
  const nA = today.filter(e => e.mode === 'auto').length, nM = today.length - nA, pct = n => today.length ? Math.round(n / today.length * 100) : 0;
  const onNames = DEV.filter(d => S.dev[d.id].on).map(d => t(d.id)).join(', ') || '—';
  const K = [
    { ic: 'fa-bolt', acc: '#10b981', l: t('kToday'), v: today.length, u: t('timesU'), m: Math.min(100, today.length / Math.max(today.length, yest.length, 1) * 100), s: t('vsYest', { n: yest.length }) },
    { ic: 'fa-robot', acc: '#14b8a6', l: t('kAuto'), v: nA, u: t('timesU'), m: pct(nA), s: t('ofAll', { p: pct(nA) }) },
    { ic: 'fa-hand', acc: '#f59e0b', l: t('kManual'), v: nM, u: t('timesU'), m: pct(nM), s: t('ofAll', { p: pct(nM) }) },
    { ic: 'fa-power-off', acc: '#38bdf8', l: t('kActive'), v: onCount(), u: t('devU'), m: onCount() / 4 * 100, s: onNames }
  ];
  $('#kpis').innerHTML = K.map((k, i) => `
    <article class="card kpi lift rise" style="--acc:${k.acc};--i:${i + 1}">
      <div class="kpi-h"><span class="kpi-l">${k.l}</span><div class="tile" style="--acc:${k.acc}"><i class="fas ${k.ic}"></i></div></div>
      <div class="kpi-v"><span class="tab" data-count="${k.v}">0</span><small>${k.u}</small></div>
      <div class="meter"><i style="width:${k.m}%"></i></div>
      <div class="kpi-s">${k.s}</div>
    </article>`).join('');
  $$('#kpis [data-count]').forEach(el => tween(el, +el.dataset.count, 0, 1000));
  bindTilt();

  // hourly
  const counts = Array(24).fill(0);
  today.forEach(e => counts[new Date(e.ts).getHours()]++);
  const max = Math.max(...counts, 1), nowH = new Date().getHours();
  $('#hours').innerHTML = counts.map((c, h) => `
    <div class="hcol ${h === nowH ? 'now' : ''}" data-tip="${pad(h)}:00 · ${c} ${t('timesU')}">
      <i class="bar ${c ? '' : 'zero'}" style="height:${c ? Math.max(10, c / max * 82) : 3}%;--i:${h}"></i><span>${h % 3 === 0 ? pad(h) : ''}</span>
    </div>`).join('');
  const peak = counts.indexOf(Math.max(...counts));
  $('#hourNote').innerHTML = today.length ? `<i class="fas fa-fire"></i>${t('peak', { h: `${pad(peak)}:00–${pad((peak + 1) % 24)}:00` })}` : `<i class="fas fa-moon"></i>${t('noPeak')}`;

  // filters
  $('#devChips').innerHTML = `<button class="fchip ${S.histDev === 'all' ? 'on' : ''}" data-hdev="all"><i class="fas fa-layer-group"></i>${t('all')}</button>` +
    DEV.map(d => `<button class="fchip ${S.histDev === d.id ? 'on' : ''}" data-hdev="${d.id}" style="--hue:${d.hue}"><i class="fas ${d.icon}"></i>${t(d.id)}</button>`).join('');
  $$('#histSeg button').forEach(b => b.classList.toggle('on', b.dataset.hmode === S.histMode));
  syncSeg($('#histSeg'));

  // timeline
  const list = S.hist.filter(e => (S.histMode === 'all' || e.mode === S.histMode) && (S.histDev === 'all' || e.dev === S.histDev));
  $('#tlSub').textContent = t('events', { n: list.length });
  if (!list.length) { $('#tl').innerHTML = `<div class="empty"><i class="fas fa-filter-circle-xmark"></i>${t('empty')}</div>`; return; }
  const groups = [];
  list.forEach(e => { const k = startOfDay(e.ts); let g = groups.find(x => x.k === k); if (!g) groups.push(g = { k, items: [] }); g.items.push(e); });
  let i = 0;
  $('#tl').innerHTML = groups.map(g => {
    const lbl = g.k === d0 ? t('today') : g.k === d1 ? t('yesterday') : fmtDate(g.k, { weekday: 'long' });
    return `<div class="tl-day">${lbl}<em>· ${fmtDate(g.k)}</em></div><div class="tl-list">` + g.items.map(e => {
      const dv = DEV.find(d => d.id === e.dev);
      let dur = '';
      if (!e.on) { const prev = S.hist.find(x => x.dev === e.dev && x.on && x.ts < e.ts); if (prev) dur = fmtDur((e.ts - prev.ts) / 1000); }
      return `<div class="ev ${e.on ? '' : 'off'}" style="--hue:${dv.hue};--i:${Math.min(i++, 14)}">
        <div class="ev-time tab">${fmtTime(e.ts)}</div>
        <div class="tile"><i class="fas ${dv.icon}"></i></div>
        <div class="ev-t"><div class="ev-title"><b>${t(e.dev)}</b><span class="tg ${e.on ? 'on' : 'off'}">${t(e.on ? 'on' : 'off')}</span></div><div class="ev-why">${whyHTML(e)}</div></div>
        <div class="ev-r"><span class="mb ${e.mode}">${e.mode.toUpperCase()}</span>${dur ? `<span class="ev-dur"><i class="far fa-clock"></i>${t('ran', { t: dur })}</span>` : ''}</div>
      </div>`;
    }).join('') + '</div>';
  }).join('');
}

/* =====================================================================
   NAVIGATION + GLOBAL EVENTS
   ===================================================================== */
function go(page) {
  if (!['dash', 'plants', 'hist'].includes(page)) page = 'dash';
  S.page = page;
  $$('.page').forEach(p => p.classList.toggle('on', p.id === 'page-' + page));
  $$('.nav-i, .bnav button').forEach(b => b.classList.toggle('on', b.dataset.go === page));
  moveInd();
  if (page === 'hist') { S.unread = 0; updateBadge(); renderHist(); }
  if (page === 'plants') renderPlants();
  if (page === 'dash') { updateSensors(); renderHealth(); refreshDevices(); if (chart) chart.resize(); }
  stagger($('#page-' + page));
  requestAnimationFrame(syncSegs);
  window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  try { history.replaceState(null, '', '#' + page); } catch (e) {}
}

function toggleTheme() {
  const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
  const apply = () => { root.dataset.theme = next; store.set('sf-theme', next); buildChart(); };
  if (!document.startViewTransition || reduce) {
    root.classList.add('theming'); apply(); setTimeout(() => root.classList.remove('theming'), 500); return;
  }
  const r = $('#themeBtn').getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  const rad = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(apply);
  vt.ready.then(() => root.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${rad}px at ${x}px ${y}px)`] },
    { duration: 700, easing: 'cubic-bezier(.22,.61,.36,1)', pseudoElement: '::view-transition-new(root)' })).catch(() => {});
}
function toggleLang() {
  lang = lang === 'th' ? 'en' : 'th'; store.set('sf-lang', lang);
  applyStatic(); renderDash(); renderPlants(); renderHist(); buildChart(); clock();
  requestAnimationFrame(() => { syncSegs(); moveInd(); });
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-mode],[data-chart],[data-ds],.dev,[data-use],[data-edit],[data-add],[data-hmode],[data-hdev],[data-close],[data-step]');
  if (!el) return;
  const d = el.dataset;
  if (d.go) return go(d.go);
  if (d.mode) return setMode(d.mode);
  if (d.chart) return setChart(d.chart);
  if (d.ds !== undefined) {
    if (!chart || S.chartMode === 'd7') return;
    const i = +d.ds, vis = chart.isDatasetVisible(i);
    chart.setDatasetVisibility(i, !vis); el.classList.toggle('off', vis); chart.update();
    return;
  }
  if (el.classList.contains('dev')) return toggleDev(d.d, el);
  if (d.use) return usePlant(d.use);
  if (d.edit) return openDrawer(d.edit);
  if (d.add !== undefined) return openDrawer(null);
  if (d.hmode) { S.histMode = d.hmode; return renderHist(); }
  if (d.hdev) { S.histDev = d.hdev; return renderHist(); }
  if (d.close !== undefined) return closeDrawer();
  if (d.step) {
    const inp = $('#' + d.step), v = parseFloat(inp.value) || 0;
    inp.value = +(v + +d.d).toFixed(1);
    updatePreviews();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
$('#themeBtn').addEventListener('click', toggleTheme);
$('#langBtn').addEventListener('click', toggleLang);
$('#fSave').addEventListener('click', savePlant);
$('#fDel').addEventListener('click', deletePlant);
$('#plantSearch').addEventListener('input', renderPlants);
$('#drawer').addEventListener('input', e => { if (e.target.matches('.step input')) updatePreviews(); });
$('#drawer').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input:not([type=file])')) savePlant(); });
(function dropzone() {
  const z = $('#drop'), f = $('#fPhoto');
  z.addEventListener('click', () => f.click());
  f.addEventListener('change', () => readPhoto(f.files[0]));
  ['dragenter', 'dragover'].forEach(n => z.addEventListener(n, e => { e.preventDefault(); z.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(n => z.addEventListener(n, e => { e.preventDefault(); z.classList.remove('over'); }));
  z.addEventListener('drop', e => readPhoto(e.dataTransfer.files[0]));
})();

/* ---------------- pointer motion ---------------- */
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.btn, .ibtn, .seg button, .fchip, .nav-i, .bnav button, .lg');
  if (!b || reduce) return;
  const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height);
  const sp = document.createElement('span');
  sp.className = 'ripple';
  sp.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
  b.appendChild(sp);
  setTimeout(() => sp.remove(), 700);
});
function bindTilt() {
  if (!canHover || reduce) return;
  $$('.sensor, .kpi').forEach(card => {
    if (card.dataset.tilt) return; card.dataset.tilt = 1;
    card.addEventListener('pointermove', e => {
      const r = card.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      card.style.transform = `perspective(800px) rotateX(${(-y * 7).toFixed(2)}deg) rotateY(${(x * 7).toFixed(2)}deg) translateY(-5px)`;
    });
    card.addEventListener('pointerleave', () => { card.style.transform = ''; });
  });
}
if (canHover && !reduce) {
  let magEl = null, raf = 0, cx = -999, cy = -999;
  document.addEventListener('pointermove', e => {
    const c = e.target.closest('.card');
    if (c) { const r = c.getBoundingClientRect(); c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px'); }
    const m = e.target.closest('.mag');
    if (magEl && magEl !== m) magEl.style.transform = '';
    magEl = m;
    if (m) { const r = m.getBoundingClientRect(); m.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * .2}px, ${(e.clientY - r.top - r.height / 2) * .3}px)`; }
    cx = e.clientX; cy = e.clientY;
    if (!raf) raf = requestAnimationFrame(() => { $('#bgCursor').style.transform = `translate3d(${cx - 320}px, ${cy - 320}px, 0)`; raf = 0; });
  });
}

/* ---------------- boot ---------------- */
root.dataset.theme = store.get('sf-theme') === 'light' ? 'light' : 'dark';
buildFsecs();
applyStatic();
renderDash(); renderPlants(); updateBadge();
$$('#chartSeg button').forEach(b => b.classList.toggle('on', b.dataset.chart === S.chartMode));
go((location.hash || '#dash').slice(1));
buildChart();
clock();
setInterval(clock, 1000);
setInterval(simulate, 3000);
addEventListener('resize', () => { syncSegs(); moveInd(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { syncSegs(); moveInd(); });
</script>
</body>
</html>
